name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Package zip archive
        shell: pwsh
        run: Compress-Archive -Path target/release/rustsight.exe -DestinationPath rustsight-windows-x64.zip -Force
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/rustsight.exe
            rustsight-windows-x64.zip
